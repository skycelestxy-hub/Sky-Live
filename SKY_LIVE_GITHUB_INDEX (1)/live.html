<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKY LIVE</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at center,#142744,#05070c 75%);color:#f2f7ff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.screen{text-align:center;padding:24px;max-width:900px;margin-bottom:46px}
.logo{color:#67aaff;font-weight:bold;letter-spacing:5px;font-size:15px}
.headline{font-size:clamp(35px,7vw,78px);margin:20px 0;text-shadow:0 0 30px #3175d5;transition:opacity .35s,transform .35s;overflow-wrap:anywhere}
.headline.swap,.sub.swap{opacity:0;transform:scale(.97)}
.sub{font-size:clamp(16px,3vw,25px);color:#b5c8e5;transition:opacity .35s,transform .35s;overflow-wrap:anywhere}
.live{color:#ff4242;letter-spacing:3px;text-shadow:0 0 30px #ff2020}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.5}}
.ticker{position:fixed;bottom:0;left:0;right:0;height:46px;overflow:hidden;background:#101c30;border-top:1px solid #29415e;color:#bcd5f7;display:flex;align-items:center}
.ticker span{display:inline-block;white-space:nowrap;padding-left:100%;animation:marquee 22s linear infinite}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.clock{position:fixed;top:20px;right:22px;color:#bcd5f7;font-variant-numeric:tabular-nums}
.donate{position:fixed;top:20px;left:20px;border:1px solid #35506f;border-radius:20px;padding:9px 14px;color:#9db9df}
.donate.on{border-color:#3ddc84;color:#3ddc84;box-shadow:0 0 14px #1f8f55}
.sound{position:fixed;top:60px;right:22px;background:#12223a;color:#bcd5f7;border:1px solid #35506f;border-radius:20px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.sound:hover{background:#1c3152}
.alert{position:fixed;top:25%;left:50%;transform:translateX(-50%);background:#12223a;border:1px solid #64a9ff;border-radius:18px;padding:22px;min-width:min(80%,420px);max-width:90%;text-align:center;box-shadow:0 0 35px #225ca8;z-index:5;animation:pop .35s ease-out}
.alert h2{margin:8px 0}
.alert p{margin:0;color:#b5c8e5;overflow-wrap:anywhere}
.alert .tag{color:#67aaff;letter-spacing:2px;font-size:12px}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.gate{position:fixed;inset:0;background:rgba(3,6,12,.93);display:flex;align-items:center;justify-content:center;z-index:10}
.gate .box{text-align:center;padding:24px}
.gate h2{color:#67aaff;margin:0 0 8px}
.gate p{color:#9db9df;margin:0 0 20px}
.gate button{background:#1c2940;color:#fff;border:1px solid #354967;border-radius:12px;padding:14px 20px;margin:6px;font:inherit;cursor:pointer}
.gate button:hover{background:#31527b}
.hide{display:none!important}
</style></head>
<body>
<div class="gate" id="gate"><div class="box">
  <h2>SKY LIVE</h2>
  <p>Ative o som para ouvir os alertas e efeitos da transmissão.</p>
  <button id="armSound">🔊 Ativar som</button>
  <button id="armSilent">Entrar sem som</button>
</div></div>

<div class="clock" id="clock"></div>
<div class="donate" id="donate">DONATE • OFF</div>
<button class="sound" id="sound" type="button">🔊 Som ligado</button>

<div class="screen">
  <div class="logo">SKY LIVE</div>
  <div class="headline pulse" id="headline">A live já vai começar</div>
  <div class="sub" id="sub">Prepare-se…</div>
</div>

<div class="ticker"><span id="tickerText">Bem-vindo à SKY LIVE</span></div>
<div class="alert hide" id="alert" role="status" aria-live="polite"></div>

<script>
const channel = new BroadcastChannel('sky-live-control');
const $ = id => document.getElementById(id);
const headline = $('headline'), sub = $('sub'), donateEl = $('donate'), alertEl = $('alert');
const tickerText = $('tickerText'), clockEl = $('clock'), gate = $('gate'), soundBtn = $('sound');
const SCREENS = {
  starting: ['A live já vai começar', 'Prepare-se…'],
  live:     ['● AO VIVO', 'Estamos transmitindo agora'],
  break:    ['Intervalo', 'Voltaremos em breve'],
  repair:   ['Estamos fazendo alguns reparos', 'Aguardem!'],
  end:      ['Transmissão encerrada', 'Obrigado por acompanhar!']
};
const STATE_KEY = 'sky-live-last';

/* ---------- SOM (Web Audio, sem arquivos externos) ---------- */
let ctx = null, armed = false, muted = localStorage.getItem('sky-live-mute') === '1';

function getCtx() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function tone(freq, start, dur, type = 'sine', vol = 0.15) {
  const c = getCtx(); if (!c) return;
  const t = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function whoosh() {
  const c = getCtx(); if (!c) return;
  const len = Math.floor(c.sampleRate * 0.6);
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.setValueAtTime(400, c.currentTime);
  f.frequency.exponentialRampToValueAtTime(2400, c.currentTime + 0.5);
  const g = c.createGain(); g.gain.value = 0.12;
  src.connect(f).connect(g).connect(c.destination);
  src.start();
}
function sfx(kind) {
  if (!armed || muted) return;
  if (!getCtx()) return;
  switch (kind) {
    case 'screen': whoosh(); tone(660, 0.12, 0.3, 'sine', 0.1); break;
    case 'alert':  tone(880, 0, 0.2, 'triangle', 0.2); tone(1174, 0.15, 0.2, 'triangle', 0.2); tone(1568, 0.32, 0.5, 'triangle', 0.15); break;
    case 'on':     [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.3, 'sine', 0.13)); break;
    case 'off':    [784, 659, 523].forEach((f, i) => tone(f, i * 0.1, 0.3, 'sine', 0.11)); break;
    case 'test':   tone(660, 0, 0.25, 'sine', 0.2); tone(990, 0.2, 0.3, 'sine', 0.15); break;
  }
}

gate.querySelector('#armSound').onclick = () => { armed = true; getCtx(); gate.classList.add('hide'); sfx('test'); };
$('armSilent').onclick = () => gate.classList.add('hide');
function renderMute() { soundBtn.textContent = muted ? '🔇 Som desligado' : '🔊 Som ligado'; }
soundBtn.onclick = () => { muted = !muted; localStorage.setItem('sky-live-mute', muted ? '1' : '0'); renderMute(); };
renderMute();

/* ---------- Visual ---------- */
function swapText(el, text, after) {
  el.classList.add('swap');
  setTimeout(() => { el.textContent = text; el.classList.remove('swap'); if (after) after(); }, 350);
}
function setScreen(x, silent) {
  if (x.screen === 'custom') {
    swapText(headline, x.message || 'Mensagem');
    headline.className = 'headline';
    swapText(sub, '');
  } else {
    const v = SCREENS[x.screen] || SCREENS.starting;
    swapText(headline, v[0]);
    headline.className = 'headline ' + (x.screen === 'live' ? 'live' : 'pulse');
    swapText(sub, x.message || v[1]);
  }
  if (!silent) { sfx('screen'); }
}
function setDonate(on, message, silent) {
  donateEl.textContent = 'DONATE • ' + (on ? 'ON' : 'OFF');
  donateEl.classList.toggle('on', !!on);
  if (message) swapText(sub, message);
  if (!silent) sfx(on ? 'on' : 'off');
}
function setTicker(text) { tickerText.textContent = text || 'Bem-vindo à SKY LIVE'; }

/* ---------- Alertas em fila (um por vez) ---------- */
const queue = [];
let showing = false;
function queueAlert(x) { queue.push(x); if (!showing) nextAlert(); }
function nextAlert() {
  const x = queue.shift();
  if (!x) { showing = false; return; }
  showing = true;
  alertEl.replaceChildren();
  const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = 'DONATE FICTÍCIO';
  const h = document.createElement('h2'); h.textContent = (x.name || 'Anônimo') + ' • ' + (x.amount || '—');
  const p = document.createElement('p'); p.textContent = x.text || '';
  alertEl.append(tag, h, p);
  alertEl.classList.remove('hide');
  sfx('alert');
  setTimeout(() => {
    alertEl.classList.add('hide');
    setTimeout(nextAlert, 400);
  }, 7000);
}

/* ---------- Mensagens ---------- */
function handle(x, silent) {
  if (!x || !x.type) return;
  switch (x.type) {
    case 'screen':    setScreen(x, silent); break;
    case 'donate':    setDonate(x.on, x.message, silent); break;
    case 'donateMsg': if (x.message) swapText(sub, x.message); break;
    case 'ticker':    setTicker(x.text); break;
    case 'alert':     if (!silent) queueAlert(x); break;
    case 'sound':     if (x.kind === 'test') sfx('test'); break;
    case 'ping':      channel.postMessage({ type: 'pong' }); break;
  }
}
channel.onmessage = e => handle(e.data, false);

/* Restaura só o último estado de tela/donate/ticker, sem alertas nem sons */
try {
  const last = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
  ['screen', 'donate', 'donateMsg', 'ticker'].forEach(k => handle(last[k], true));
} catch {}

/* ---------- Relógio ---------- */
const fmt = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function tick() { clockEl.textContent = fmt.format(new Date()); }
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
