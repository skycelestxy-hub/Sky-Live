<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKY LIVE • Painel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b14;color:#eaf1ff;font-family:Arial,sans-serif;padding:24px}main{max-width:900px;margin:auto}h1{color:#68a7ff}section{background:#121a2b;border:1px solid #263653;border-radius:16px;padding:20px;margin:14px 0}button,input,textarea,select{background:#1c2940;color:white;border:1px solid #354967;border-radius:9px;padding:12px;margin:5px}button{cursor:pointer}button:hover{background:#31527b}.row{display:flex;flex-wrap:wrap;gap:8px}.big{font-size:18px}textarea{width:100%;min-height:70px}small{color:#9bb2d4}
</style></head><body><main>
<h1>SKY LIVE — Painel</h1><small>Controle da transmissão demonstrativa • Alertas de donate fictícios</small>
<section><h2>Estado da live</h2><div class="row"><button onclick="setScreen('starting')">A live já vai começar</button><button onclick="setScreen('live')">Estamos ao vivo</button><button onclick="setScreen('break')">Intervalo</button><button onclick="setScreen('repair')">Manutenção</button><button onclick="setScreen('end')">Encerrar</button></div>
<textarea id="message" placeholder="Mensagem personalizada (opcional)"></textarea><button onclick="setScreen('custom')">Exibir mensagem</button></section>
<section><h2>Donate fictício</h2><div class="row"><button onclick="donate(true)">Donate ON</button><button onclick="donate(false)">Donate OFF</button></div><input id="donateMsg" placeholder="Mensagem ON/OFF"><button onclick="saveDonateMsg()">Salvar mensagem</button><div class="row"><input id="donor" placeholder="Nome do doador"><input id="amount" placeholder="Valor fictício (ex. R$ 5)"><input id="donationText" placeholder="Mensagem"><button onclick="alertDonate()">Enviar alerta</button></div></section>
<section><h2>Texto de rodapé</h2><input id="ticker" style="width:80%" placeholder="Texto que aparece na faixa"><button onclick="sendTicker()">Atualizar</button></section>
<section><h2>Prévia / conexão</h2><p>Abra <b>Live.html</b> em outra aba do mesmo navegador. Ambas as páginas devem estar na mesma origem do GitHub Pages.</p><button onclick="window.open('live.html','_blank')">Abrir Live</button></section>
</main><script>
const channel=new BroadcastChannel('sky-live-control');
function send(data){channel.postMessage(data);localStorage.setItem('sky-live-state',JSON.stringify({...data,_time:Date.now()}))}
function setScreen(screen){send({type:'screen',screen,message:document.getElementById('message').value})}
function donate(on){send({type:'donate',on,message:document.getElementById('donateMsg').value})}
function saveDonateMsg(){send({type:'donateMsg',message:document.getElementById('donateMsg').value})}
function alertDonate(){send({type:'alert',name:document.getElementById('donor').value||'Anônimo',amount:document.getElementById('amount').value||'—',text:document.getElementById('donationText').value})}
function sendTicker(){send({type:'ticker',text:document.getElementById('ticker').value})}
</script></body></html>
