<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKY LIVE</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#142744,#05070c 75%);color:#f2f7ff;font-family:Arial;display:flex;min-height:100vh;align-items:center;justify-content:center;overflow:hidden}.screen{text-align:center;padding:24px;max-width:900px}.logo{color:#67aaff;font-weight:bold;letter-spacing:5px;font-size:15px}.headline{font-size:clamp(35px,7vw,78px);margin:20px 0;text-shadow:0 0 30px #3175d5}.sub{font-size:clamp(16px,3vw,25px);color:#b5c8e5}.live{color:#ff4242;letter-spacing:3px}.ticker{position:fixed;bottom:0;background:#101c30;border-top:1px solid #29415e;width:100%;padding:13px;text-align:center;color:#bcd5f7}.clock{position:fixed;top:20px;right:22px;color:#bcd5f7}.donate{position:fixed;top:20px;left:20px;border:1px solid #35506f;border-radius:20px;padding:9px 14px;color:#9db9df}.alert{position:fixed;top:25%;left:50%;transform:translateX(-50%);background:#12223a;border:1px solid #64a9ff;border-radius:18px;padding:22px;min-width:min(80%,420px);text-align:center;box-shadow:0 0 35px #225ca8;animation:pop .3s}@keyframes pop{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}.hide{display:none}.pulse{animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.5}} </style></head><body>
<div class="clock" id="clock"></div><div class="donate" id="donate">DONATE • OFF</div><div class="screen"><div class="logo">SKY LIVE</div><div class="headline pulse" id="headline">A live já vai começar</div><div class="sub" id="sub">Prepare-se…</div></div><div class="ticker" id="ticker">Bem-vindo à SKY LIVE</div><div class="alert hide" id="alert"></div>
<script>
const channel=new BroadcastChannel('sky-live-control');const h=document.getElementById('headline'),s=document.getElementById('sub'),d=document.getElementById('donate'),a=document.getElementById('alert');
const screens={starting:['A live já vai começar','Prepare-se…'],live:['● AO VIVO','Estamos transmitindo agora'],break:['Intervalo','Voltaremos em breve'],repair:['Estamos fazendo alguns reparos','Aguardem!'],end:['Transmissão encerrada','Obrigado por acompanhar!']};
function apply(x){if(x.type==='screen'){if(x.screen==='custom'){h.textContent=x.message||'Mensagem';s.textContent='';}else{let v=screens[x.screen]||screens.starting;h.textContent=v[0];s.textContent=x.message||v[1];h.className='headline'+(x.screen==='live'?' live':' pulse')}}else if(x.type==='donate'){d.textContent='DONATE • '+(x.on?'ON':'OFF');if(x.message)s.textContent=x.message}else if(x.type==='donateMsg'){s.textContent=x.message}else if(x.type==='ticker'){document.getElementById('ticker').textContent=x.text}else if(x.type==='alert'){a.innerHTML='<b>DONATE FICTÍCIO</b><h2>'+esc(x.name)+' • '+esc(x.amount)+'</h2><p>'+esc(x.text)+'</p>';a.classList.remove('hide');setTimeout(()=>a.classList.add('hide'),8000)}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
channel.onmessage=e=>apply(e.data);try{let old=JSON.parse(localStorage.getItem('sky-live-state'));if(old)apply(old)}catch{}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR'),1000);
</script></body></html>
